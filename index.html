    <noscript><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Alex+Brush&family=Cinzel:wght@500;700;800&family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Parisienne&family=Dancing+Script:wght@700&family=Cormorant+Garamond:ital,wght@0,600;1,600&display=swap" rel="stylesheet"></noscript>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('Service Worker registered successfully:', reg.scope);
              reg.update();

              // Trigger SW check when tab becomes visible or gets focus
              document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                  reg.update().catch(() => {});
                }
              });
              window.addEventListener('focus', () => {
                reg.update().catch(() => {});
              });

              // Periodic update check every 15 minutes
              setInterval(() => {
                reg.update().catch(() => {});
              }, 15 * 60 * 1000);
            })
            .catch((err) => console.log('Service Worker registration failed:', err));

          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });

          // Ask for persistent storage so the SW cache survives browser eviction
          if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist().catch(() => {});
          }
        });
      }
    </script>
  </body>
